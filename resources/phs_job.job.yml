# Monthly PHS waiting-times refresh: download -> bronze -> silver with data-quality checks.

resources:
  jobs:
    phs_job:
      name: careconnect-phs-${bundle.target}
      max_concurrent_runs: 1

      schedule:
        quartz_cron_expression: "0 0 7 5 * ?" # 07:00 on the 5th of each month
        timezone_id: Europe/London
        pause_status: PAUSED

      tasks:
        - task_key: phs_waiting_times
          python_wheel_task:
            package_name: careconnect
            entry_point: phs
            parameters:
              - "--env"
              - "${bundle.target}"
              - "--config"
              - "${workspace.file_path}/project_config.yml"
              - "--download"
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
