# This is a Declarative Automation Bundle definition for careconnect.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: careconnect
  uuid: 6c6e1fe4-dadd-4e36-b123-ba2652928e68

# Keep Unity Catalog schema names identical in every target
# (no "dev_<user>_" prefix), so they match project_config.yml.
experimental:
  skip_name_prefix_for_schema: true

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # 'mode: development' prefixes jobs with '[dev <user>]' and pauses schedules.
    # See https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-35c4a1f0-8494.cloud.databricks.com
    variables:
      catalog: workspace
      schema: careconnect_dev

  prod:
    mode: production
    workspace:
      host: https://dbc-35c4a1f0-8494.cloud.databricks.com
      # Single shared copy under the deploying user's folder.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: careconnect_prod
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
