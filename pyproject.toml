[project]
name = "careconnect"
version = "0.0.1"
description = "CareConnect Navigator: LLMOps and MLOps on Databricks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlflow[databricks]>=3",
    "databricks-sdk",
    "databricks-openai",
    "openai",
    "pydantic>=2",
    "pyyaml",
]

[project.scripts]
main = "careconnect.main:main"

[dependency-groups]
dev = [
    "databricks-connect~=17.3",
    "pytest",
    "ruff",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careconnect"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
