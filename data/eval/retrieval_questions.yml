# Labelled questions for retrieval evaluation (Week 2, Step 9).
#
# A retrieved chunk counts as relevant when its doc_id matches a label AND its text
# contains that label's evidence phrase (case, markdown and whitespace ignored).
# Labels never name chunk ids, so the same set scores any chunking config.
# Questions q01-q46 are paraphrased on purpose: they should not just repeat the leaflet
# wording. Questions marked `kind: exact` use the exact terms a patient might copy from a
# letter (CHI number, HC2, phone numbers, clinic names, postcodes) to test keyword matching.
# Questions without a kind count as `paraphrase`.

questions:
  # ---------------------------------------------------------------- complaints
  - id: q01
    question: Is there a deadline for raising a complaint about my hospital care?
    relevant:
      - {doc_id: fvhb-16, evidence: "normally within 6 months"}
  - id: q02
    question: How long does a full investigation of a serious complaint take?
    relevant:
      - {doc_id: fvhb-16, evidence: "20 working days"}
  - id: q03
    question: Who can look at my complaint if I'm still not happy after the hospital has investigated it?
    relevant:
      - {doc_id: fvhb-16, evidence: "Scottish Public Services Ombudsman"}
  - id: q35
    question: Is there an independent service that can help me with an NHS complaint?
    relevant:
      - {doc_id: fvhb-18, evidence: "raise a concern or make a complaint"}
      - {doc_id: fvhb-16, evidence: "Patient Advice and Support Service can help you make a complaint"}
  - id: q45
    question: Can mediation be used to sort out a disagreement about my NHS care?
    relevant:
      - {doc_id: policy-charter-patient-rights-2022, evidence: "mediation"}
  - id: q46
    question: What is the first stage of the NHS complaints handling procedure?
    relevant:
      - {doc_id: fvhb-16, evidence: "Stage 1, early resolution"}
      - {doc_id: policy-nhs-model-complaints-procedure, evidence: "early resolution"}

  # -------------------------------------------------------------- appointments
  - id: q04
    question: How quickly do I need to respond when the hospital contacts me to agree a date?
    relevant:
      - {doc_id: fvhb-02, evidence: "reply within 7 days"}
  - id: q05
    question: How many times can I rearrange my appointment without losing my place on the list?
    relevant:
      - {doc_id: fvhb-02, evidence: "change your appointment once"}
  - id: q06
    question: Can I cancel my appointment by text or email instead of phoning?
    relevant:
      - {doc_id: fvhb-02, evidence: "use the link in your appointment text message"}
  - id: q07
    question: If my child misses a hospital appointment, will they be sent back to the GP?
    relevant:
      - {doc_id: fvhb-03, evidence: "under 16"}
  - id: q08
    question: I missed my appointment and was discharged to my GP. Do I have to start waiting all over again?
    relevant:
      - {doc_id: fvhb-03, evidence: "A new referral starts a new waiting time"}
  - id: q28
    question: How do video consultations work and do I need to install anything?
    relevant:
      - {doc_id: fvhb-13, evidence: "NHS Near Me"}
  - id: q29
    question: How early should I get to my outpatient clinic?
    relevant:
      - {doc_id: fvhb-13, evidence: "arrive 10 minutes before"}
  - id: q42
    question: What happens if I turn down two appointment dates I've been offered?
    relevant:
      - {doc_id: policy-waiting-for-nhs-treatment-2023, evidence: "refuse 2 reasonable offers"}

  # ----------------------------------------------------- sites and services
  - id: q09
    question: What time does the minor injuries unit close?
    relevant:
